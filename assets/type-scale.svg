  <text class="gf-ink" x="340" y="1030" font-size="17" font-weight="400" fill="#090B0C" font-family="&#39;IBM Plex Serif&#39;, Georgia, &#39;Times New Roman&#39;, serif">Every piece is turned by hand the morning it ships — read the full</text>
  <text class="gf-ink" x="340" y="1056" font-size="17" font-weight="400" fill="#090B0C" font-family="&#39;IBM Plex Serif&#39;, Georgia, &#39;Times New Roman&#39;, serif">story of the workshop, the clay, and the kiln behind the shelf.</text>
  <line class="gs-hairline" x1="48" y1="1082" x2="1152" y2="1082" stroke="#E3E7E8" stroke-width="1"></line>

  
