  <text class="gf-ink" x="340" y="962" font-size="22" font-weight="600" letter-spacing="-0.1" fill="#090B0C" font-family="&#39;IBM Plex Serif&#39;, Georgia, &#39;Times New Roman&#39;, serif">The maker&#39;s note</text>
