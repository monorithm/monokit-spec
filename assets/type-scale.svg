  <text class="gf-ink" x="48" y="64" font-size="20" font-weight="600" fill="#090B0C" letter-spacing="-0.2">monokit type scale</text>
  <text class="gf-muted" x="48" y="88" font-size="13" fill="#67787C">One IBM Plex superfamily, three registers — Sans for chrome &amp; content, Serif for reading, Mono for data. Each role at true relative size.</text>
